<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c1220; --line:#1b2840;
    --txt:#dbe7ff; --dim:#6f86ad;
    --blue:#3d8bff; --cyan:#62e6ff; --red:#ff5470; --green:#3ee38a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%,#12203a 0%,var(--bg) 55%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ===== ORB ===== */
  .orb-wrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:22px 0 10px}
  .orb{
    width:150px;height:150px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 36% 30%,#bfe4ff 0%,#4aa8ff 32%,#0a5cff 62%,#1a2a86 100%);
    box-shadow:0 0 0 1px #1e4f9e inset,0 0 40px -6px #2f7bff,0 0 90px -20px #0a5cff;
    transition:transform .18s ease, box-shadow .3s ease;
    cursor:pointer;
  }
  .orb::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(98,230,255,.18);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.07);opacity:.9}}
  body.listening .orb{box-shadow:0 0 0 2px #2e8bff inset,0 0 60px 2px #2f7bff,0 0 130px -10px #0a5cff;animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  body.thinking .orb{background:radial-gradient(circle at 36% 30%,#d8f4ff 0%,#62e6ff 40%,#0a5cff 75%,#1a2a86 100%)}
  body.speaking .orb{box-shadow:0 0 0 2px #62e6ff inset,0 0 70px 4px #2f7bff}
  .orb-label{margin-top:14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  body.listening .orb-label{color:var(--cyan)}
  body.thinking .orb-label{color:var(--blue)}
  body.speaking .orb-label{color:var(--green)}

  /* ===== CHAT ===== */
  .chat{flex:1 1 auto;overflow-y:auto;padding:8px 14px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:linear-gradient(160deg,#1b3a6b,#12305c);border:1px solid #2a4d86;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .sys{align-self:center;font-size:12px;color:var(--dim);background:transparent;border:1px dashed var(--line);padding:6px 10px}
  .ai .tag{display:inline-block;font-size:10px;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase;margin-bottom:4px}

  /* ===== INPUT ===== */
  .bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#05070d 70%,transparent);border-top:1px solid var(--line)}
  .bar input{
    flex:1;background:#0a101c;border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:12px 14px;font-size:15px;outline:none;
  }
  .bar input:focus{border-color:#2e6dff;box-shadow:0 0 0 3px rgba(46,109,255,.16)}
  .btn{
    border:0;border-radius:12px;padding:0 16px;height:46px;font-size:15px;font-weight:600;
    background:linear-gradient(160deg,#3d8bff,#1b5fd6);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:#0a101c;border:1px solid var(--line);color:var(--txt)}
  .btn.mic{width:46px;padding:0;border-radius:50%}
  body.listening .btn.mic{background:linear-gradient(160deg,#ff5470,#c21f3d);animation:pulse .9s infinite}

  /* ===== SHEET ===== */
  .sheet{
    position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(6px);
    display:none;align-items:flex-end;z-index:50;
  }
  .sheet.open{display:flex}
  .sheet-body{
    width:100%;max-height:82vh;overflow:auto;background:#080d17;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h3{margin:0 0 14px;font-size:16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #10192b;font-size:14px}
  .row:last-child{border-bottom:0}
  .row small{color:var(--dim);display:block;font-size:11.5px;margin-top:2px}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--green);border-color:#1d5c3c;background:#0a1f16}
  .pill.no{color:var(--red);border-color:#5c1d2a;background:#1f0a10}
  .row button{border:1px solid var(--line);background:#0c1424;color:var(--txt);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}

  /* toast */
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#0c1424;border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:13px;
    transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* app list */
  .applist{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .appitem{background:#0c1424;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-size:12px;cursor:pointer;overflow:hidden}
  .appitem b{display:block;font-size:20px;margin-bottom:6px;color:var(--cyan)}
  .appitem span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<!-- ORB -->
<div class="orb-wrap">
  <div class="orb" id="orb"></div>
  <div class="orb-label" id="orbLabel">Ketuk untuk bicara</div>
</div>

<!-- CHAT -->
<div class="chat" id="chat">
  <div class="msg sys">Jarvis v1 · native siap</div>
</div>

<!-- INPUT -->
<div class="bar">
  <button class="btn ghost" id="menuBtn" title="Pengaturan">⚙</button>
  <input id="input" placeholder="Ketik perintah…" autocomplete="off">
  <button class="btn mic" id="micBtn" title="Bicara">🎙</button>
</div>

<!-- SHEET PENGATURAN -->
<div class="sheet" id="sheet">
  <div class="sheet-body">
    <h3>Status & Pengaturan</h3>
    <div id="statusList"></div>
    <div style="height:12px"></div>
    <div class="row"><span>Layanan latar belakang</span>
      <div><button id="kaStart">Mulai</button> <button id="kaStop">Stop</button></div>
    </div>
    <div class="row"><span>Senter<small>Toggle on/off</small></span><button id="torchBtn">Toggle</button></div>
    <div class="row"><span>Volume media</span>
      <div><button data-vol="-10">−</button> <button data-vol="+10">+</button></div>
    </div>
    <div class="row"><span>Daftar aplikasi</span><button id="appsBtn">Buka</button></div>
    <div class="row"><span>Bagikan teks</span><button id="shareBtn">Bagikan</button></div>
    <div class="row"><span>Salin ke clipboard</span><button id="copyBtn">Salin</button></div>
    <div style="height:8px"></div>
    <button class="btn ghost" id="closeSheet" style="width:100%;height:44px">Tutup</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="plugins.js"></script>
<script>
/* =========================================================
   JARVIS CORE
   ========================================================= */
const JV = window.JV || {};
const $ = s => document.querySelector(s);
const chat = $('#chat'), input = $('#input'), orb = $('#orb'), orbLabel = $('#orbLabel');
let mode = 'idle'; // idle | listening | thinking | speaking

function setMode(m){
  mode = m;
  document.body.classList.remove('listening','thinking','speaking');
  if(m!=='idle') document.body.classList.add(m);
  orbLabel.textContent = {
    idle:'Ketuk untuk bicara', listening:'Mendengarkan…',
    thinking:'Berpikir…', speaking:'Berbicara…'
  }[m];
}
function toast(t){
  const el=$('#toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200);
}
function addMsg(text, who='ai'){
  const d=document.createElement('div');
  d.className='msg '+who;
  if(who==='ai') d.innerHTML='<span class="tag">Jarvis</span>'+escapeHtml(text);
  else d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return d;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* =========================================================
   TTS — Text to Speech
   ========================================================= */
async function speak(text){
  addMsg(text,'ai');
  if(!JV.native || !JV.TTS){
    // fallback browser
    try{
      const u=new SpeechSynthesisUtterance(text); u.lang='id-ID';
      speechSynthesis.speak(u); setMode('speaking');
      u.onend=()=>setMode('idle');
    }catch{ setMode('idle'); }
    return;
  }
  try{
    setMode('speaking');
    await JV.TTS.speak({ text, lang:'id-ID', rate:1.0, pitch:1.0, volume:1.0 });
  }catch(e){ console.warn('TTS', e); }
  setMode('idle');
}

/* =========================================================
   ASR — Speech Recognition
   ========================================================= */
let listening = false;
async function startListen(){
  if(listening) return;
  if(!JV.native || !JV.SR){
    toast('Speech recognition hanya di APK');
    return;
  }
  try{
    const perm = await JV.SR.checkPermissions();
    if(perm.speechRecognition!=='granted'){
      const req = await JV.SR.requestPermissions();
      if(req.speechRecognition!=='granted'){ toast('Izin mikrofon ditolak'); return; }
    }
  }catch(e){ /* lanjut coba */ }

  listening = true; setMode('listening');
  try{
    await JV.SR.start({
      language:'id-ID',
      maxResults:1,
      partialResults:false,
      popup:false
    });
  }catch(e){
    listening=false; setMode('idle');
    toast('Gagal mulai mikrofon: '+(e.message||e));
  }
}
async function stopListen(){
  if(!listening) return;
  listening=false;
  try{ await JV.SR.stop(); }catch{}
  setMode('idle');
}

/* pasang listener SR */
if(JV.native && JV.SR){
  JV.SR.addListener('partialResults', ev=>{
    const t = (ev.matches && ev.matches[0]) || '';
    if(t) orbLabel.textContent = t.slice(0,40);
  });
  JV.SR.addListener('listeningState', ev=>{
    if(ev.state==='stopped'){ listening=false; if(mode==='listening') setMode('idle'); }
  });
  JV.SR.addListener('results', ev=>{
    const t = (ev.matches && ev.matches[0]) || '';
    listening=false; setMode('idle');
    if(t) handleUser(t);
  });
}

/* =========================================================
   INPUT — teks & suara
   ========================================================= */
function handleUser(text){
  text = text.trim(); if(!text) return;
  addMsg(text,'me');
  route(text);
}

$('#input').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const v=input.value; input.value=''; handleUser(v); }
});
$('#micBtn').onclick = ()=> listening ? stopListen() : startListen();
orb.onclick = ()=> listening ? stopListen() : startListen();

/* event dari widget / MainActivity */
window.addEventListener('jv-voice', ()=>{
  // cek pending voice dari plugin
  if(JV.native && JV.KA && JV.KA.pending){
    JV.KA.pending().then(r=>{ if(r.v) startListen(); });
  } else {
    startListen();
  }
});

/* =========================================================
   ROUTER PERINTAH (rule-based sederhana, mudah ditambah)
   ========================================================= */
async function route(raw){
  const t = raw.toLowerCase();
  setMode('thinking');

  /* ---- senter ---- */
  if(/\b(senter|lampu|flash|torch)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Senter hanya bisa di APK.'); }
    const on = /\b(on|nyala|hidupkan|aktifkan)\b/.test(t);
    const off= /\b(off|mati|matikan)\b/.test(t);
    const m = on?'on':off?'off':'toggle';
    try{
      const r = await JV.KA.torch({mode:m});
      setMode('idle'); return speak(r.on?'Senter dinyalakan.':'Senter dimatikan.');
    }catch(e){ setMode('idle'); return speak('Senter gagal: '+e.message); }
  }

  /* ---- volume ---- */
  if(/\b(volume|suara)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Volume hanya bisa di APK.'); }
    const up = /\b(naik|besar|tinggi|tambah)\b/.test(t);
    const dn = /\b(turun|kecil|pelan|kurang)\b/.test(t);
    const pct = t.match(/(\d{1,3})\s*(%|persen)/);
    try{
      let args={jenis:'media'};
      if(pct) args.persen=parseInt(pct[1]);
      else if(up) args.ubah=10;
      else if(dn) args.ubah=-10;
      const r = await JV.KA.volume(args);
      setMode('idle'); return speak('Volume sekarang '+r.persen+' persen.');
    }catch(e){ setMode('idle'); return speak('Gagal ubah volume: '+e.message); }
  }

  /* ---- buka app ---- */
  if(/^(buka|open|jalankan|launch)\s+(.+)/.test(t)){
    const name = raw.replace(/^(buka|open|jalankan|launch)\s+/i,'').trim();
    if(!JV.native){ setMode('idle'); return speak('Buka aplikasi hanya bisa di APK.'); }
    try{
      const r = await JV.KA.apps();
      const hit = r.apps.find(a=> a.n.toLowerCase().includes(name.toLowerCase()) || a.v.toLowerCase().includes(name.toLowerCase()));
      if(!hit){ setMode('idle'); return speak('Aplikasi "'+name+'" tidak ditemukan.'); }
      await JV.AL.openUrl({url:hit.v});
      setMode('idle'); return speak('Membuka '+hit.n+'.');
    }catch(e){ setMode('idle'); return speak('Gagal buka aplikasi: '+e.message); }
  }

  /* ---- lokasi ---- */
  if(/\b(lokasi|posisi|gps|dimana|di mana)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Lokasi hanya bisa di APK.'); }
    try{
      const p = await JV.GEO.getCurrentPosition({enableHighAccuracy:true,timeout:15000});
      const lat=p.coords.latitude.toFixed(5), lon=p.coords.longitude.toFixed(5);
      setMode('idle');
      return speak('Lokasi Anda '+lat+', '+lon+'. Membuka peta.');
    }catch(e){ setMode('idle'); return speak('Gagal ambil lokasi: '+e.message); }
  }

  /* ---- info perangkat ---- */
  if(/\b(perangkat|device|hp|baterai|battery)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Info perangkat hanya di APK.'); }
    try{
      const info = await JV.DV.getInfo();
      const bat = await JV.DV.getBatteryInfo();
      setMode('idle');
      return speak('Perangkat '+info.model+', Android '+info.osVersion+', baterai '+Math.round(bat.batteryLevel*100)+' persen.');
    }catch(e){ setMode('idle'); return speak('Gagal baca perangkat: '+e.message); }
  }

  /* ---- salin ---- */
  if(/^(salin|copy)\s+(.+)/.test(t)){
    const text = raw.replace(/^(salin|copy)\s+/i,'');
    try{
      if(JV.native && JV.CB) await JV.CB.write({string:text});
      else await navigator.clipboard.writeText(text);
      setMode('idle'); return speak('Sudah disalin.');
    }catch(e){ setMode('idle'); return speak('Gagal salin: '+e.message); }
  }

  /* ---- bagikan ---- */
  if(/^(bagikan|share)\s+(.+)/.test(t)){
    const text = raw.replace(/^(bagikan|share)\s+/i,'');
    try{
      if(JV.native && JV.SH) await JV.SH.share({title:'Jarvis', text});
      else if(navigator.share) await navigator.share({text});
      else { toast('Share tidak didukung'); }
      setMode('idle'); return speak('Siap dibagikan.');
    }catch(e){ setMode('idle'); return speak('Gagal bagikan: '+e.message); }
  }

  /* ---- notifikasi ---- */
  if(/\b(notif|notifikasi|ingatkan|reminder)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Notifikasi hanya di APK.'); }
    try{
      const perm = await JV.LN.checkPermissions();
      if(perm.display!=='granted') await JV.LN.requestPermissions();
      await JV.LN.schedule({
        notifications:[{
          title:'Jarvis', body: raw, id: Date.now()%100000,
          schedule:{ at: new Date(Date.now()+5000) }
        }]
      });
      setMode('idle'); return speak('Notifikasi dijadwalkan 5 detik lagi.');
    }catch(e){ setMode('idle'); return speak('Gagal jadwalkan notifikasi: '+e.message); }
  }

  /* ---- layanan latar belakang ---- */
  if(/\b(latar|background|keep\s*alive|layanan)\b/.test(t)){
    if(!JV.native){ setMode('idle'); return speak('Layanan latar hanya di APK.'); }
    try{
      if(/\b(stop|mati|hentikan)\b/.test(t)) await JV.KA.stop();
      else await JV.KA.start();
      setMode('idle'); return speak('Layanan latar diperbarui.');
    }catch(e){ setMode('idle'); return speak('Gagal: '+e.message); }
  }

  /* ---- default: echo + bantuan ---- */
  setMode('idle');
  speak('Saya mendengar: '+raw+'. Coba perintah: senter, volume, buka aplikasi, lokasi, info perangkat, salin, bagikan, notifikasi, atau latar belakang.');
}

/* =========================================================
   PANEL PENGATURAN
   ========================================================= */
$('#menuBtn').onclick = async ()=>{
  $('#sheet').classList.add('open');
  if(JV.native && JV.KA && JV.KA.status){
    try{
      const s = await JV.KA.status();
      $('#statusList').innerHTML = `
        <div class="row"><span>Izin baterai<small>Jangan optimasi</small></span><span class="pill ${s.battery?'ok':'no'}">${s.battery?'AKTIF':'BELUM'}</span></div>
        <div class="row"><span>Overlay<small>Izin tampil di atas</small></span><span class="pill ${s.overlay?'ok':'no'}">${s.overlay?'AKTIF':'BELUM'}</span></div>
        <div class="row"><span>Alarm tepat<small>Untuk notifikasi presisi</small></span><span class="pill ${s.exact?'ok':'no'}">${s.exact?'AKTIF':'BELUM'}</span></div>
        <div class="row"><span>Lokasi latar<small>Izin background</small></span><span class="pill ${s.bgloc?'ok':'no'}">${s.bgloc?'AKTIF':'BELUM'}</span></div>
      `;
    }catch(e){ $('#statusList').innerHTML='<div class="msg sys">Gagal baca status</div>'; }
  } else {
    $('#statusList').innerHTML='<div class="msg sys">Mode web — plugin native tidak aktif</div>';
  }
};
$('#closeSheet').onclick = ()=> $('#sheet').classList.remove('open');
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('open'); });

$('#kaStart').onclick = ()=> JV.KA?.start?.().then(()=>toast('Layanan dimulai')).catch(e=>toast(e.message));
$('#kaStop').onclick  = ()=> JV.KA?.stop?.().then(()=>toast('Layanan dihentikan')).catch(e=>toast(e.message));
$('#torchBtn').onclick= ()=> JV.KA?.torch?.({mode:'toggle'}).then(r=>toast('Senter '+(r.on?'ON':'OFF'))).catch(e=>toast(e.message));
document.querySelectorAll('[data-vol]').forEach(b=>{
  b.onclick = ()=> JV.KA?.volume?.({jenis:'media', ubah:parseInt(b.dataset.vol)}).then(r=>toast('Volume '+r.persen+'%')).catch(e=>toast(e.message));
});
$('#shareBtn').onclick = ()=> {
  const t = chat.lastElementChild?.textContent || 'Jarvis';
  if(JV.SH) JV.SH.share({title:'Jarvis', text:t}); else navigator.share?.({text:t});
};
$('#copyBtn').onclick = async ()=>{
  const t = chat.lastElementChild?.textContent || '';
  try{ if(JV.CB) await JV.CB.write({string:t}); else await navigator.clipboard.writeText(t); toast('Disalin'); }
  catch(e){ toast('Gagal: '+e.message); }
};
$('#appsBtn').onclick = async ()=>{
  if(!JV.KA?.apps){ toast('Hanya di APK'); return; }
  try{
    const r = await JV.KA.apps();
    const wrap = document.createElement('div');
    wrap.className='applist';
    r.apps.slice(0,60).forEach(a=>{
      const b=document.createElement('div');
      b.className='appitem';
      b.innerHTML='<b>▦</b><span>'+escapeHtml(a.n)+'</span>';
      b.onclick=()=>{ JV.AL.openUrl({url:a.v}).catch(e=>toast(e.message)); };
      wrap.appendChild(b);
    });
    const body=$('.sheet-body'); body.querySelector('.applist')?.remove(); body.appendChild(wrap);
  }catch(e){ toast(e.message); }
};

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  if(JV.native){
    addMsg('Mode native aktif. Semua fitur tersedia.','sys');
    // tanya izin notifikasi + lokasi awal
    try{ await JV.LN.requestPermissions(); }catch{}
    try{ await JV.GEO.requestPermissions(); }catch{}
    try{ await JV.SR.requestPermissions(); }catch{}
  } else {
    addMsg('Mode web. Fitur native terbatas.','sys');
  }
})();
</script>
</body>
</html>
