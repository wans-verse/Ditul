name: Build APK Jarvis

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "jarvis",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor/app-launcher": "^8.0.0",
              "@capacitor/clipboard": "^8.0.0",
              "@capacitor/device": "^8.0.0",
              "@capacitor/geolocation": "^8.0.0",
              "@capacitor/local-notifications": "^8.0.0",
              "@capacitor/share": "^8.0.0",
              "@capacitor-community/text-to-speech": "^8.0.0",
              "@capgo/capacitor-speech-recognition": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0",
              "esbuild": "^0.25.0"
            }
          }
          EOF
          cat > plugins.src.js <<'EOF'
          import { Capacitor, registerPlugin } from '@capacitor/core';
          import { SpeechRecognition } from '@capgo/capacitor-speech-recognition';
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          import { AppLauncher } from '@capacitor/app-launcher';
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { Device } from '@capacitor/device';
          import { Geolocation } from '@capacitor/geolocation';
          import { Clipboard } from '@capacitor/clipboard';
          import { Share } from '@capacitor/share';
          window.JV = {
            native: Capacitor.isNativePlatform(),
            SR: SpeechRecognition, TTS: TextToSpeech, AL: AppLauncher, LN: LocalNotifications,
            DV: Device, GEO: Geolocation, CB: Clipboard, SH: Share,
            KA: registerPlugin('KeepAlive')
          };
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jarvis.agent",
            "appName": "Jarvis",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF

      - name: Pasang dependensi dan buat proyek Android
        run: |
          npm install --no-audit --no-fund
          npx esbuild plugins.src.js --bundle --minify --format=iife --outfile=www/plugins.js
          npx cap add android

      - name: Izin, ikon, dan pengaturan keyboard
        run: |
          python3 - <<'PY'
          import os, re

          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              s = f.read()

          add = """
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
          """
          s = s.replace('</manifest>', add + '</manifest>')

          svc = """
                  <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="otomasi latar belakang"/>
                  </service>
                  <activity android:name=".VoiceActivity" android:theme="@style/VoiceTheme" android:taskAffinity="" android:excludeFromRecents="true" android:exported="false" android:launchMode="singleTask" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"/>
                  <service android:name=".JarvisNotifService" android:label="Jarvis" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
                  <receiver android:name=".VoiceWidget" android:label="Jarvis Suara" android:exported="false">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/voice_widget_info"/>
                  </receiver>
              """
          s = s.replace('</application>', svc + '</application>')

          if 'windowSoftInputMode' in s:
              s = re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustResize"', s)
          else:
              s = s.replace('<activity', '<activity android:windowSoftInputMode="adjustResize"', 1)

          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)

          r = 'android/app/src/main/res/'
          os.makedirs(r + 'drawable', exist_ok=True)
          os.makedirs(r + 'values', exist_ok=True)
          os.makedirs(r + 'mipmap-anydpi-v26', exist_ok=True)

          fg_content = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M54,54m-23,0a23,23 0,1 1,46 0a23,23 0,1 1,-46 0">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="radial" android:centerX="46" android:centerY="44" android:gradientRadius="34">
                          <item android:offset="0" android:color="#FFD4ECFF"/>
                          <item android:offset="0.35" android:color="#FF4AA8FF"/>
                          <item android:offset="0.7" android:color="#FF0A5CFF"/>
                          <item android:offset="1" android:color="#FF1A2A86"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>"""
          with open(r + 'drawable/jarvis_fg.xml', 'w', encoding='utf-8') as f:
              f.write(fg_content)

          with open(r + 'values/ic_launcher_background.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#05070D</color></resources>')

          icon = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/jarvis_fg"/></adaptive-icon>'
          for n in ('ic_launcher', 'ic_launcher_round'):
              with open(r + 'mipmap-anydpi-v26/' + n + '.xml', 'w', encoding='utf-8') as f:
                  f.write(icon)

          os.makedirs(r + 'layout', exist_ok=True)
          os.makedirs(r + 'xml', exist_ok=True)

          with open(r + 'values/voice_theme.xml', 'w', encoding='utf-8') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="VoiceTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:backgroundDimEnabled">false</item>
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowContentTransitions">false</item>
              </style>
          </resources>""")

          with open(r + 'drawable/widget_orb.xml', 'w', encoding='utf-8') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:type="radial" android:centerX="0.35" android:centerY="0.3" android:gradientRadius="60dp"
                  android:startColor="#FF9AD2FF" android:centerColor="#FF2E8CFF" android:endColor="#FF0A3FCF"/>
          </shape>""")

          with open(r + 'layout/widget_voice.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n'
                  '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/vw_root" '
                  'android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center">'
                  '<FrameLayout android:layout_width="84dp" android:layout_height="84dp">'
                  '<ImageView android:id="@+id/vw_ring" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="fitXY" android:src="@drawable/widget_ring_0" android:visibility="invisible"/>'
                  '<ImageView android:layout_width="64dp" android:layout_height="64dp" android:layout_gravity="center" android:src="@drawable/widget_orb" android:contentDescription="Bicara"/>'
                  '</FrameLayout>'
                  '<TextView android:id="@+id/vw_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="2dp" android:text="Bicara" '
                  'android:textColor="#FFFFFFFF" android:textSize="13sp" android:shadowColor="#CC000000" android:shadowRadius="6" android:shadowDx="0" android:shadowDy="1"/>'
                  '</LinearLayout>')

          for k in range(8):
              t = k / 7.0
              p = int(round(3 + 9 * (1 - t)))
              a = int(round(230 * (1 - t)))
              with open(r + 'drawable/widget_ring_%d.xml' % k, 'w', encoding='utf-8') as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?>'
                      '<inset xmlns:android="http://schemas.android.com/apk/res/android" '
                      'android:insetLeft="%d%%" android:insetTop="%d%%" android:insetRight="%d%%" android:insetBottom="%d%%">'
                      '<shape android:shape="oval"><stroke android:width="3dp" android:color="#%02X4AA8FF"/><solid android:color="#00000000"/></shape>'
                      '</inset>' % (p, p, p, p, a))

          with open(r + 'xml/voice_widget_info.xml', 'w', encoding='utf-8') as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp" android:minHeight="110dp"
              android:targetCellWidth="2" android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_voice"
              android:resizeMode="none"
              android:widgetCategory="home_screen"/>""")
          PY

      - name: Kode native latar belakang
        run: |
          D=android/app/src/main/java/com/jarvis/agent
          mkdir -p $D
          cat > $D/MainActivity.java <<'EOF'
          package com.jarvis.agent;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            static boolean pendingVoice = false;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              android.webkit.CookieManager cm = android.webkit.CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setCookie("https://localhost", "jvmode=main; path=/");
              cm.flush();
              registerPlugin(KeepAlivePlugin.class);
              super.onCreate(savedInstanceState);
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }
              check(getIntent(), false);
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              check(intent, true);
            }

            private void check(Intent i, boolean warm) {
              if (i != null && i.getBooleanExtra("suara", false)) {
                i.removeExtra("suara");
                pendingVoice = true;
                if (warm && getBridge() != null && getBridge().getWebView() != null) {
                  getBridge().getWebView().post(() ->
                    getBridge().getWebView().evaluateJavascript("window.dispatchEvent(new Event('jv-voice'))", null));
                }
              }
            }
          }
          EOF
          cat > $D/KeepAliveService.java <<'EOF'
          package com.jarvis.agent;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class KeepAliveService extends Service {
            private PowerManager.WakeLock wl;
            private android.content.BroadcastReceiver rx;
            private android.net.ConnectivityManager.NetworkCallback nc;
            private android.media.AudioDeviceCallback adc;
            private long t0 = 0;
            private int hs = 0;

            @Override
            public IBinder onBind(Intent i) { return null; }

            private static boolean isHs(android.media.AudioDeviceInfo d) {
              if (d == null || !d.isSink()) return false;
              int t = d.getType();
              return t == android.media.AudioDeviceInfo.TYPE_WIRED_HEADSET
                || t == android.media.AudioDeviceInfo.TYPE_WIRED_HEADPHONES
                || t == android.media.AudioDeviceInfo.TYPE_BLUETOOTH_A2DP
                || t == android.media.AudioDeviceInfo.TYPE_USB_HEADSET
                || (Build.VERSION.SDK_INT >= 31 && t == android.media.AudioDeviceInfo.TYPE_BLE_HEADSET);
            }

            @Override
            public void onCreate() {
              super.onCreate();
              t0 = System.currentTimeMillis();
              try {
                rx = new android.content.BroadcastReceiver() {
                  @Override
                  public void onReceive(android.content.Context c, Intent i) {
                    String a = i.getAction();
                    if (Intent.ACTION_SCREEN_ON.equals(a)) KeepAlivePlugin.emit("layar_on", "", "", "");
                    else if (Intent.ACTION_SCREEN_OFF.equals(a)) KeepAlivePlugin.emit("layar_off", "", "", "");
                  }
                };
                android.content.IntentFilter f = new android.content.IntentFilter();
                f.addAction(Intent.ACTION_SCREEN_ON);
                f.addAction(Intent.ACTION_SCREEN_OFF);
                if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, android.content.Context.RECEIVER_NOT_EXPORTED);
                else registerReceiver(rx, f);
              } catch (Exception e) {}
              try {
                android.net.ConnectivityManager cm = (android.net.ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                nc = new android.net.ConnectivityManager.NetworkCallback() {
                  @Override
                  public void onAvailable(android.net.Network n) {
                    if (System.currentTimeMillis() - t0 > 3000) KeepAlivePlugin.emit("wifi_on", "", "", "");
                  }
                  @Override
                  public void onLost(android.net.Network n) {
                    if (System.currentTimeMillis() - t0 > 3000) KeepAlivePlugin.emit("wifi_off", "", "", "");
                  }
                };
                cm.registerNetworkCallback(new android.net.NetworkRequest.Builder().addTransportType(android.net.NetworkCapabilities.TRANSPORT_WIFI).build(), nc);
              } catch (Exception e) {}
              try {
                android.media.AudioManager am = (android.media.AudioManager) getSystemService(AUDIO_SERVICE);
                adc = new android.media.AudioDeviceCallback() {
                  @Override
                  public void onAudioDevicesAdded(android.media.AudioDeviceInfo[] ds) {
                    int n = 0;
                    for (android.media.AudioDeviceInfo d : ds) if (isHs(d)) n++;
                    if (n == 0) return;
                    boolean was = hs > 0;
                    hs += n;
                    if (!was && System.currentTimeMillis() - t0 > 3000) KeepAlivePlugin.emit("headset_on", "", "", "");
                  }
                  @Override
                  public void onAudioDevicesRemoved(android.media.AudioDeviceInfo[] ds) {
                    int n = 0;
                    for (android.media.AudioDeviceInfo d : ds) if (isHs(d)) n++;
                    if (n == 0) return;
                    hs = Math.max(0, hs - n);
                    if (hs == 0) KeepAlivePlugin.emit("headset_off", "", "", "");
                  }
                };
                am.registerAudioDeviceCallback(adc, new android.os.Handler(android.os.Looper.getMainLooper()));
              } catch (Exception e) {}
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              try {
                NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                Notification.Builder b;
                if (Build.VERSION.SDK_INT >= 26) {
                  nm.createNotificationChannel(new NotificationChannel("jarvis_bg", "Jarvis aktif", NotificationManager.IMPORTANCE_LOW));
                  b = new Notification.Builder(this, "jarvis_bg");
                } else {
                  b = new Notification.Builder(this);
                }
                PendingIntent pi = PendingIntent.getActivity(this, 0, new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                Notification n = b.setContentTitle("Jarvis aktif")
                  .setContentText("Otomasi berjalan di latar belakang")
                  .setSmallIcon(android.R.drawable.ic_dialog_info)
                  .setContentIntent(pi)
                  .setOngoing(true)
                  .build();
                if (Build.VERSION.SDK_INT >= 34) {
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                } else {
                  startForeground(1, n);
                }
                if (wl == null) {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jarvis:ka");
                  wl.acquire();
                }
              } catch (Exception e) {
                stopSelf();
              }
              return START_STICKY;
            }

            @Override
            public void onDestroy() {
              if (wl != null && wl.isHeld()) wl.release();
              try { if (rx != null) unregisterReceiver(rx); } catch (Exception e) {}
              try { if (nc != null) ((android.net.ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE)).unregisterNetworkCallback(nc); } catch (Exception e) {}
              try { if (adc != null) ((android.media.AudioManager) getSystemService(AUDIO_SERVICE)).unregisterAudioDeviceCallback(adc); } catch (Exception e) {}
              super.onDestroy();
            }
          }
          EOF
          cat > $D/KeepAlivePlugin.java <<'EOF'
          package com.jarvis.agent;

          import android.content.Intent;
          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.os.Vibrator;
          import android.os.VibrationEffect;
          import android.provider.AlarmClock;
          import android.view.KeyEvent;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.PowerManager;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import com.getcapacitor.PermissionState;

          @CapacitorPlugin(name = "KeepAlive", permissions = {
            @Permission(strings = { android.Manifest.permission.READ_CONTACTS }, alias = "kontak")
          })
          public class KeepAlivePlugin extends Plugin {
            @PluginMethod
            public void start(PluginCall call) {
              Intent i = new Intent(getContext(), KeepAliveService.class);
              if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
              else getContext().startService(i);
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              getContext().stopService(new Intent(getContext(), KeepAliveService.class));
              call.resolve();
            }

            @PluginMethod
            public void battery(PluginCall call) {
              go(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getContext().getPackageName())));
              call.resolve();
            }

            @PluginMethod
            public void overlay(PluginCall call) {
              go(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getContext().getPackageName())));
              call.resolve();
            }

            @PluginMethod
            public void apps(PluginCall call) {
              PackageManager pm = getContext().getPackageManager();
              Intent q = new Intent(Intent.ACTION_MAIN);
              q.addCategory(Intent.CATEGORY_LAUNCHER);
              JSArray arr = new JSArray();
              for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                JSObject o = new JSObject();
                o.put("n", ri.loadLabel(pm).toString());
                o.put("v", ri.activityInfo.packageName);
                arr.put(o);
              }
              JSObject res = new JSObject();
              res.put("apps", arr);
              call.resolve(res);
            }

          @PluginMethod
          public void close(PluginCall call) {
            call.resolve();
            if (getActivity() != null) getActivity().finish();
          }

          @PluginMethod
          public void pending(PluginCall call) {
            JSObject o = new JSObject();
            o.put("v", MainActivity.pendingVoice);
            MainActivity.pendingVoice = false;
            call.resolve(o);
          }

          @PluginMethod
          public void status(PluginCall call) {
            Context c = getContext();
            PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
            boolean ex = true;
            if (Build.VERSION.SDK_INT >= 31) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              ex = am.canScheduleExactAlarms();
            }
            JSObject o = new JSObject();
            o.put("battery", pm.isIgnoringBatteryOptimizations(c.getPackageName()));
            o.put("overlay", Settings.canDrawOverlays(c));
            o.put("exact", ex);
            o.put("bgloc", Build.VERSION.SDK_INT < 29 || c.checkSelfPermission("android.permission.ACCESS_BACKGROUND_LOCATION") == PackageManager.PERMISSION_GRANTED);
            o.put("dnd", ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).isNotificationPolicyAccessGranted());
            o.put("write", Settings.System.canWrite(c));
            o.put("notif", notifOk(c));
            call.resolve(o);
          }

          @PluginMethod
          public void exact(PluginCall call) {
            if (Build.VERSION.SDK_INT >= 31) {
              go(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + getContext().getPackageName())));
            }
            call.resolve();
          }

          @PluginMethod
          public void bgLocation(PluginCall call) {
            go(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName())));
            call.resolve();
          }

          static boolean torchOn = false;
          static boolean torchCb = false;

          @PluginMethod
          public void torch(PluginCall call) {
            try {
              CameraManager cm = (CameraManager) getContext().getSystemService(Context.CAMERA_SERVICE);
              if (!torchCb) {
                torchCb = true;
                cm.registerTorchCallback(new CameraManager.TorchCallback() {
                  @Override
                  public void onTorchModeChanged(String id, boolean enabled) { torchOn = enabled; }
                }, new Handler(Looper.getMainLooper()));
              }
              String id = null;
              for (String cid : cm.getCameraIdList()) {
                CameraCharacteristics ch = cm.getCameraCharacteristics(cid);
                Boolean fl = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                Integer face = ch.get(CameraCharacteristics.LENS_FACING);
                if (fl != null && fl && face != null && face == CameraCharacteristics.LENS_FACING_BACK) { id = cid; break; }
              }
              if (id == null) { call.reject("HP ini tidak punya senter"); return; }
              String mode = call.getString("mode", "toggle");
              boolean want = "on".equals(mode) ? true : ("off".equals(mode) ? false : !torchOn);
              cm.setTorchMode(id, want);
              torchOn = want;
              JSObject o = new JSObject();
              o.put("on", want);
              call.resolve(o);
            } catch (Exception e) {
              call.reject("Senter gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void volume(PluginCall call) {
            try {
              AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              String j = call.getString("jenis", "media");
              int st = AudioManager.STREAM_MUSIC;
              if ("dering".equals(j)) st = AudioManager.STREAM_RING;
              else if ("alarm".equals(j)) st = AudioManager.STREAM_ALARM;
              else if ("notifikasi".equals(j)) st = AudioManager.STREAM_NOTIFICATION;
              else if ("panggilan".equals(j)) st = AudioManager.STREAM_VOICE_CALL;
              int max = am.getStreamMaxVolume(st);
              int cur = am.getStreamVolume(st);
              Integer lv = call.getInt("persen");
              Integer dl = call.getInt("ubah");
              int target = cur;
              if (lv != null) {
                target = Math.round(lv * max / 100f);
              } else if (dl != null) {
                int step = Math.round(dl * max / 100f);
                if (step == 0 && dl != 0) step = dl > 0 ? 1 : -1;
                target = cur + step;
              }
              target = Math.max(0, Math.min(max, target));
              if (target != cur) am.setStreamVolume(st, target, AudioManager.FLAG_SHOW_UI);
              JSObject o = new JSObject();
              o.put("persen", Math.round(am.getStreamVolume(st) * 100f / max));
              call.resolve(o);
            } catch (SecurityException e) {
              call.reject("Volume ini butuh izin Jangan Ganggu di pengaturan HP");
            } catch (Exception e) {
              call.reject("Volume gagal: " + e.getMessage());
            }
          }

          static final java.util.ArrayList<KeepAlivePlugin> insts = new java.util.ArrayList<>();

          @Override
          public void load() {
            synchronized (insts) { insts.add(this); }
          }

          @Override
          protected void handleOnDestroy() {
            synchronized (insts) { insts.remove(this); }
          }

          static void emit(String type, String a, String b, String c) {
            synchronized (insts) {
              for (KeepAlivePlugin p : new java.util.ArrayList<>(insts)) {
                try {
                  JSObject o = new JSObject();
                  o.put("type", type);
                  o.put("a", a == null ? "" : a);
                  o.put("b", b == null ? "" : b);
                  o.put("c", c == null ? "" : c);
                  p.notifyListeners("event", o);
                } catch (Exception e) {}
              }
            }
          }

          static boolean notifOk(Context c) {
            String s = Settings.Secure.getString(c.getContentResolver(), "enabled_notification_listeners");
            return s != null && s.contains(c.getPackageName());
          }

          @PluginMethod
          public void vibrate(PluginCall call) {
            try {
              int ms = Math.max(50, Math.min(5000, call.getInt("ms", 400)));
              Vibrator v;
              if (Build.VERSION.SDK_INT >= 31) {
                android.os.VibratorManager vm = (android.os.VibratorManager) getContext().getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                v = vm.getDefaultVibrator();
              } else {
                v = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
              }
              if (v == null || !v.hasVibrator()) { call.reject("HP ini tidak punya getar"); return; }
              if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
              else v.vibrate(ms);
              call.resolve();
            } catch (Exception e) {
              call.reject("Getar gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void alarm(PluginCall call) {
            try {
              Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
              int jam = call.getInt("jam", 7);
              int menit = call.getInt("menit", 0);
              i.putExtra(AlarmClock.EXTRA_HOUR, jam);
              i.putExtra(AlarmClock.EXTRA_MINUTES, menit);
              i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("pesan", "Jarvis"));
              i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
              JSArray hr = call.getArray("hari");
              if (hr != null && hr.length() > 0) {
                java.util.ArrayList<Integer> d = new java.util.ArrayList<>();
                for (int k = 0; k < hr.length(); k++) d.add(hr.getInt(k));
                i.putExtra(AlarmClock.EXTRA_DAYS, d);
              }
              go(i);
              call.resolve();
            } catch (Exception e) {
              call.reject("Alarm gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void dnd(PluginCall call) {
            try {
              NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
              if (!nm.isNotificationPolicyAccessGranted()) {
                go(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                call.reject("Izinkan akses Jangan Ganggu untuk Jarvis di pengaturan yang baru terbuka, lalu ulangi.");
                return;
              }
              String mode = call.getString("mode", "toggle");
              int cur = nm.getCurrentInterruptionFilter();
              boolean isOn = cur != NotificationManager.INTERRUPTION_FILTER_ALL && cur != NotificationManager.INTERRUPTION_FILTER_UNKNOWN;
              int f;
              if ("off".equals(mode)) f = NotificationManager.INTERRUPTION_FILTER_ALL;
              else if ("alarm".equals(mode)) f = NotificationManager.INTERRUPTION_FILTER_ALARMS;
              else if ("total".equals(mode)) f = NotificationManager.INTERRUPTION_FILTER_NONE;
              else if ("on".equals(mode)) f = NotificationManager.INTERRUPTION_FILTER_PRIORITY;
              else f = isOn ? NotificationManager.INTERRUPTION_FILTER_ALL : NotificationManager.INTERRUPTION_FILTER_PRIORITY;
              nm.setInterruptionFilter(f);
              JSObject o = new JSObject();
              o.put("on", f != NotificationManager.INTERRUPTION_FILTER_ALL);
              call.resolve(o);
            } catch (Exception e) {
              call.reject("Mode senyap gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void brightness(PluginCall call) {
            try {
              Context c = getContext();
              if (!Settings.System.canWrite(c)) {
                go(new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + c.getPackageName())));
                call.reject("Izinkan 'Ubah setelan sistem' untuk Jarvis di pengaturan yang baru terbuka, lalu ulangi.");
                return;
              }
              android.content.ContentResolver cr = c.getContentResolver();
              JSObject o = new JSObject();
              if ("auto".equals(call.getString("mode"))) {
                Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC);
                o.put("auto", true);
                call.resolve(o);
                return;
              }
              Integer p = call.getInt("persen");
              Integer d = call.getInt("ubah");
              int cur = Settings.System.getInt(cr, Settings.System.SCREEN_BRIGHTNESS, 128);
              int curP = Math.round(cur * 100f / 255f);
              int target = p != null ? p : (d != null ? curP + d : curP);
              target = Math.max(1, Math.min(100, target));
              Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
              Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS, Math.max(1, Math.round(target * 255f / 100f)));
              o.put("persen", target);
              call.resolve(o);
            } catch (Exception e) {
              call.reject("Kecerahan gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void media(PluginCall call) {
            try {
              String a = call.getString("aksi", "toggle");
              int code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
              if ("play".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PLAY;
              else if ("pause".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PAUSE;
              else if ("next".equals(a)) code = KeyEvent.KEYCODE_MEDIA_NEXT;
              else if ("prev".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
              else if ("stop".equals(a)) code = KeyEvent.KEYCODE_MEDIA_STOP;
              AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              long t = android.os.SystemClock.uptimeMillis();
              am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_DOWN, code, 0));
              am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_UP, code, 0));
              call.resolve();
            } catch (Exception e) {
              call.reject("Kontrol media gagal: " + e.getMessage());
            }
          }

          @PluginMethod
          public void notifAccess(PluginCall call) {
            boolean ok = notifOk(getContext());
            if (!ok && Boolean.TRUE.equals(call.getBoolean("buka", false))) {
              go(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
            }
            JSObject o = new JSObject();
            o.put("on", ok);
            call.resolve(o);
          }

          @PluginMethod
          public void kontak(PluginCall call) {
            if (getPermissionState("kontak") != PermissionState.GRANTED) {
              requestPermissionForAlias("kontak", call, "kontakCb");
              return;
            }
            cariKontak(call);
          }

          @PermissionCallback
          private void kontakCb(PluginCall call) {
            if (getPermissionState("kontak") == PermissionState.GRANTED) cariKontak(call);
            else call.reject("Izin kontak ditolak. Izinkan di pengaturan aplikasi Jarvis.");
          }

          private void cariKontak(PluginCall call) {
            android.database.Cursor cur = null;
            try {
              String q = call.getString("nama", "").trim();
              if (q.isEmpty()) { call.reject("Isi nama kontak"); return; }
              cur = getContext().getContentResolver().query(
                android.provider.ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                new String[] {
                  android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                  android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER
                },
                android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                new String[] { "%" + q + "%" },
                android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC");
              JSArray arr = new JSArray();
              java.util.HashSet<String> seen = new java.util.HashSet<>();
              while (cur != null && cur.moveToNext() && arr.length() < 8) {
                String n = cur.getString(0);
                String v = cur.getString(1);
                if (v == null) continue;
                String key = n + "|" + v.replaceAll("[^0-9+]", "");
                if (!seen.add(key)) continue;
                JSObject o = new JSObject();
                o.put("n", n);
                o.put("v", v);
                arr.put(o);
              }
              JSObject res = new JSObject();
              res.put("kontak", arr);
              call.resolve(res);
            } catch (Exception e) {
              call.reject("Kontak gagal: " + e.getMessage());
            } finally {
              if (cur != null) cur.close();
            }
          }

          private void go(Intent i) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
            }
          }
          EOF

          cat > $D/JarvisNotifService.java <<'EOF'
          package com.jarvis.agent;

          import android.app.Notification;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class JarvisNotifService extends NotificationListenerService {
            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
              try {
                if (sbn == null || getPackageName().equals(sbn.getPackageName())) return;
                Notification n = sbn.getNotification();
                if (n == null || sbn.isOngoing()) return;
                if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                CharSequence t = n.extras.getCharSequence(Notification.EXTRA_TITLE);
                CharSequence x = n.extras.getCharSequence(Notification.EXTRA_TEXT);
                KeepAlivePlugin.emit("notif", sbn.getPackageName(), t == null ? "" : t.toString(), x == null ? "" : x.toString());
              } catch (Exception e) {}
            }
          }
          EOF

          cat > $D/VoiceActivity.java <<'EOF'
          package com.jarvis.agent;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.CookieManager;
          import com.getcapacitor.BridgeActivity;

          public class VoiceActivity extends BridgeActivity {
            static int alive = 0;
            private int frame = 0;
            private final Handler hd = new Handler(Looper.getMainLooper());
            private final Runnable tick = new Runnable() {
              @Override
              public void run() {
                VoiceWidget.setFrame(VoiceActivity.this, frame % 8);
                frame++;
                hd.postDelayed(this, 110);
              }
            };

            @Override
            public void setTheme(int resid) {
              super.setTheme(R.style.VoiceTheme);
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              alive++;
              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setCookie("https://localhost", "jvmode=voice; path=/");
              cm.flush();
              registerPlugin(KeepAlivePlugin.class);
              super.onCreate(savedInstanceState);
              try {
                getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(Color.TRANSPARENT));
                getWindow().getDecorView().setBackgroundColor(Color.TRANSPARENT);
              } catch (Exception e) {}
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().setBackgroundColor(Color.TRANSPARENT);
                getBridge().getWebView().setAlpha(0f);
                getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }
              hd.post(tick);
              hd.postDelayed(() -> { if (!isFinishing()) finish(); }, 150000);
            }

            @Override
            public void onDestroy() {
              hd.removeCallbacksAndMessages(null);
              if (--alive <= 0) {
                alive = 0;
                CookieManager cm = CookieManager.getInstance();
                cm.setCookie("https://localhost", "jvmode=main; path=/");
                cm.flush();
                VoiceWidget.setFrame(this, -1);
              }
              super.onDestroy();
            }
          }
          EOF

          cat > $D/VoiceWidget.java <<'EOF'
          package com.jarvis.agent;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.RemoteViews;

          public class VoiceWidget extends AppWidgetProvider {
            static final int[] RING = {
              R.drawable.widget_ring_0, R.drawable.widget_ring_1, R.drawable.widget_ring_2, R.drawable.widget_ring_3,
              R.drawable.widget_ring_4, R.drawable.widget_ring_5, R.drawable.widget_ring_6, R.drawable.widget_ring_7
            };

            static RemoteViews build(Context c, int frame) {
              Intent i = new Intent(c, VoiceActivity.class);
              i.setAction("com.jarvis.agent.VOICE");
              i.putExtra("suara", true);
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
              PendingIntent pi = PendingIntent.getActivity(c, 7, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_voice);
              v.setOnClickPendingIntent(R.id.vw_root, pi);
              if (frame >= 0) {
                v.setViewVisibility(R.id.vw_ring, View.VISIBLE);
                v.setImageViewResource(R.id.vw_ring, RING[frame % RING.length]);
                v.setTextViewText(R.id.vw_label, "Mendengarkan");
              }
              return v;
            }

            static void setFrame(Context c, int frame) {
              try {
                AppWidgetManager m = AppWidgetManager.getInstance(c);
                int[] ids = m.getAppWidgetIds(new ComponentName(c, VoiceWidget.class));
                for (int id : ids) m.updateAppWidget(id, build(c, frame));
              } catch (Exception e) {}
            }

            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) m.updateAppWidget(id, build(c, -1));
            }
          }
